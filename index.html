<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO Clicker - Gem Edition</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent: #4caf50;
            --rarity-blue: #4b69ff;
            --rarity-red: #eb4b4b;
            --rarity-gold: #caab05;
        }

        body.light-theme {
            --bg-color: #f0f0f0;
            --text-color: #121212;
            --accent: #2e7d32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        #nav { display: flex; justify-content: space-around; padding: 15px; background: rgba(0,0,0,0.2); }
        .page { display: none; padding: 20px; text-align: center; height: 80vh; overflow-y: auto; }
        .active { display: block; }

        /* Clicker */
        #click-btn { 
            width: 200px; height: 200px; border-radius: 50%; border: none;
            background: var(--accent); color: white; font-size: 24px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        #click-btn:active { transform: scale(0.95); }

        /* Case Opening */
        .case-card { 
            border: 2px solid var(--text-color); padding: 20px; 
            display: inline-block; width: 200px; cursor: pointer;
        }

        /* Inventory */
        .inv-item {
            border-left: 5px solid; margin: 5px; padding: 10px;
            background: rgba(255,255,255,0.1); display: flex; justify-content: space-between;
        }

        /* Chat Window */
        #chat-box {
            position: fixed; bottom: 20px; right: 20px; width: 300px;
            background: #1e1e1e; border: 1px solid #333; display: none;
            flex-direction: column; border-radius: 8px; z-index: 100;
        }
        #chat-content { height: 200px; overflow-y: auto; padding: 10px; font-size: 14px; text-align: left; }
        #chat-toggle { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; cursor: pointer; }

        .rarity-Gold { color: var(--rarity-gold); border-color: var(--rarity-gold); }
        .rarity-Red { color: var(--rarity-red); border-color: var(--rarity-red); }
        .rarity-Blue { color: var(--rarity-blue); border-color: var(--rarity-blue); }
    </style>
</head>
<body>

<div id="nav">
    <button onclick="showPage('clicker')">Clicker</button>
    <button onclick="showPage('cases')">Cases</button>
    <button onclick="showPage('inventory')">Inventory</button>
    <button onclick="showPage('settings')">Settings</button>
    <div>Wallet: $<span id="balance">0</span></div>
</div>

<!-- Clicker Page -->
<div id="clicker" class="page active">
    <h1 id="user-display">Player</h1>
    <button id="click-btn" onclick="addMoney()">CLICK<br>+$1</button>
</div>

<!-- Cases Page -->
<div id="cases" class="page">
    <h2>Weapon Cases</h2>
    <div class="case-card" onclick="openCase()">
        <h3>Chroma Case</h3>
        <p>Price: $50</p>
        <small>Includes Gems & Knives</small>
    </div>
    <div id="unboxed-result" style="margin-top: 20px; font-weight: bold;"></div>
</div>

<!-- Inventory Page -->
<div id="inventory" class="page">
    <h2>Your Inventory</h2>
    <div id="inv-list"></div>
</div>

<!-- Settings Page -->
<div id="settings" class="page">
    <h2>Settings</h2>
    <input type="text" id="username-input" placeholder="New Username">
    <button onclick="updateUsername()">Save Name</button>
    <br><br>
    <button onclick="toggleTheme()">Toggle Theme</button>
</div>

<!-- Chat -->
<button id="chat-toggle" onclick="toggleChat()">Open Chat</button>
<div id="chat-box">
    <div style="padding: 10px; background: #333; display: flex; justify-content: space-between;">
        <span>Global Chat</span>
        <button onclick="toggleChat()">X</button>
    </div>
    <div id="chat-content"></div>
</div>

<script>
    let balance = 0;
    let inventory = [];
    let username = "Player";

    const skins = [
        { name: "P250 | Sand Dune", rarity: "Blue", chance: 0.7 },
        { name: "AK-47 | Redline", rarity: "Red", chance: 0.2 },
        { name: "Karambit | Ruby", rarity: "Gold", chance: 0.03 },
        { name: "M9 Bayonet | Sapphire", rarity: "Gold", chance: 0.03 },
        { name: "Butterfly | Emerald", rarity: "Gold", chance: 0.03 },
        { name: "Karambit | Blue Gem", rarity: "Gold", chance: 0.01 }
    ];

    const chatMessages = [
        "Just unboxed a Ruby!!",
        "Anyone want to trade?",
        "Imagine not having a blue gem lol",
        "Clicking is so tired...",
        "I just spent $5000 on cases and got nothing."
    ];

    function addMoney() {
        balance++;
        updateUI();
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function openCase() {
        if (balance < 50) return alert("Not enough money!");
        balance -= 50;

        const rand = Math.random();
        let cumulative = 0;
        let wonSkin = skins[0];

        for (let skin of skins) {
            cumulative += skin.chance;
            if (rand < cumulative) {
                wonSkin = skin;
                break;
            }
        }

        const float = Math.random().toFixed(8);
        const newItem = { ...wonSkin, float: float };
        inventory.push(newItem);
        
        document.getElementById('unboxed-result').innerHTML = 
            `You got: <span class="rarity-${newItem.rarity}">${newItem.name}</span> (Float: ${float})`;
        
        updateUI();
        renderInventory();
        if(newItem.rarity === "Gold") addChatMessage(username, `just unboxed a ${newItem.name}!`);
    }

    function renderInventory() {
        const list = document.getElementById('inv-list');
        list.innerHTML = inventory.map(item => `
            <div class="inv-item rarity-${item.rarity}">
                <span>${item.name}</span>
                <span>Float: ${item.float}</span>
            </div>
        `).join('');
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance;
        document.getElementById('user-display').innerText = username;
    }

    function toggleChat() {
        const box = document.getElementById('chat-box');
        box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function addChatMessage(user, msg) {
        const content = document.getElementById('chat-content');
        content.innerHTML += `<div><strong>${user}:</strong> ${msg}</div>`;
        content.scrollTop = content.scrollHeight;
    }

    function updateUsername() {
        const val = document.getElementById('username-input').value;
        if(val) username = val;
        updateUI();
    }

    function toggleTheme() {
        document.body.classList.toggle('light-theme');
    }

    // Auto Chat Simulation
    setInterval(() => {
        const randomMsg = chatMessages[Math.floor(Math.random() * chatMessages.length)];
        const users = ["S1mple", "GabeN", "KennyS", "Bot_Bob"];
        addChatMessage(users[Math.floor(Math.random() * users.length)], randomMsg);
    }, 5000);

</script>
</body>
</html>
